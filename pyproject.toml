[project]
name = "caf-control-api"
version = "0.1.0"
description = "CAF local control API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary,pool]>=3.2,<4"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caf_control_api"]
